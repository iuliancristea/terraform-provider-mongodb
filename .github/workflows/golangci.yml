name: golangci
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

jobs:
  go_lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4

  go_test:
    name: golang test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'
      - name: Run Test
        run: go test ./...
